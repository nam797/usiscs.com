# Just enough shipping setup to take an order through checkout locally:
# the US country and zone. The shipping methods (UPS, and FedEx switched
# off) come from the same command production uses:
#
#   php -d memory_limit=-1 bin/console sylius:fixtures:load checkout_shipping -n
#   php -d memory_limit=-1 bin/console app:shipping:setup-methods
#
# Adds to the database (no purge). Run it once: a second run fails on the
# duplicate country/zone codes.
when@dev:
    sylius_fixtures:
        suites:
            checkout_shipping:
                fixtures:
                    geographical:
                        options:
                            countries: ['US']
                            zones:
                                US:
                                    name: 'United States of America'
                                    countries: ['US']

