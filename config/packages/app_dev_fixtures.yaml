# Just enough shipping setup to take an order through checkout locally:
# the US country and zone, and one flat-rate shipping method on the
# "default" channel. Real shipping rates aren't decided yet.
#
#   php -d memory_limit=-1 bin/console sylius:fixtures:load checkout_shipping -n
#
# Adds to the database (no purge). Run it once: a second run fails on the
# duplicate country/zone/method codes.
when@dev:
    sylius_fixtures:
        suites:
            checkout_shipping:
                fixtures:
                    geographical:
                        options:
                            countries: ['US']
                            zones:
                                US:
                                    name: 'United States of America'
                                    countries: ['US']

                    shipping_method:
                        options:
                            custom:
                                standard:
                                    code: 'standard'
                                    name: 'Standard Shipping'
                                    description: 'Flat-rate shipping for testing checkout.'
                                    enabled: true
                                    zone: 'US'
                                    channels: ['default']
                                    calculator:
                                        type: 'flat_rate'
                                        configuration:
                                            default:
                                                amount: 1500
