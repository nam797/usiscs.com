# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Lead and order emails are sent from this address. It must be on a
    # domain the mail provider (MAILER_DSN) is verified to send for.
    env(MAILER_FROM): 'no-reply@usiscs.com'
    # ORS Nasco supplier APIs (src/Supplier/OrsNasco). Defaults point at ORS's
    # test endpoints; the production URLs and every credential go in
    # .env.local / Upsun variables, never in .env.
    env(ORS_AVAILABILITY_URL): 'https://apim.workato.com/orsnascotest/availability/bulkavailability'
    env(ORS_OAUTH_TOKEN_URL): ''
    env(ORS_OAUTH_CLIENT_ID): ''
    env(ORS_OAUTH_CLIENT_SECRET): ''
    env(ORS_PA_URL): 'https://webservices.orsnasco.com/ORSInventoryQueryToolWSV3TEST/ORSInventoryQueryTool.asmx'
    env(ORS_CUSTNO): ''
    env(ORS_PA_PASSWORD): ''
    env(ORS_PA_PASSWORD2): ''
    # Order Query web service (order status and tracking): its own password pair.
    env(ORS_ORDER_QUERY_URL): 'https://webservices.orsnasco.com/ORSOrderQueryV1TEST/ORSOrderQuery.asmx'
    env(ORS_OQ_PASSWORD): ''
    env(ORS_OQ_PASSWORD2): ''
    # How the dev/test-only "Test distributor" behaves: accept, down, reject
    # or manual (src/Distributor/Fake/FakeDistributor.php).
    env(FAKE_DISTRIBUTOR_MODE): 'accept'
    # Cross-dock: business days from the distributor shipping to the delivery
    # reaching our warehouse. Sets each purchase order's expected date when
    # its first tracking number arrives; staff can change the date.
    app.cross_dock_transit_days: 3
    # Card payments are only authorized at checkout and charged when the first
    # purchase order ships; one still held after this many days is charged
    # anyway (app:payments:capture-due), before Stripe releases it at ~7.
    app.capture_authorized_after_days: 6

services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # Registers html_classes()/html_cva() for EasyAdminBundle 5's own templates.
    # twig/html-extra is installed but has no Flex recipe here (no
    # twig/extra-bundle), so its extension needs manual registration.
    Twig\Extra\Html\HtmlExtension: ~
