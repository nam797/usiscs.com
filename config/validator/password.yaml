# Strong passwords (App\Validator\StrongPassword) everywhere a password is
# set: shop registration, change password and reset password, the same for
# the API, and admin users. Sylius's own rules (not blank, at least 4
# characters) still apply; these are added on top, in the same groups.
Sylius\Component\User\Model\User:
    properties:
        plainPassword:
            - App\Validator\StrongPassword:
                groups: [sylius_user_registration, sylius_user_create, sylius]

Sylius\Bundle\UserBundle\Form\Model\ChangePassword:
    properties:
        newPassword:
            - App\Validator\StrongPassword:
                groups: [sylius]

Sylius\Bundle\UserBundle\Form\Model\PasswordReset:
    properties:
        password:
            - App\Validator\StrongPassword:
                groups: [sylius]

Sylius\Bundle\ApiBundle\Command\Account\RegisterShopUser:
    properties:
        password:
            - App\Validator\StrongPassword:
                groups: [sylius]

Sylius\Bundle\ApiBundle\Command\Account\ChangeShopUserPassword:
    properties:
        newPassword:
            - App\Validator\StrongPassword:
                groups: [sylius]

Sylius\Bundle\ApiBundle\Command\Account\ResetPassword:
    properties:
        newPassword:
            - App\Validator\StrongPassword:
                groups: [sylius]

Sylius\Bundle\CoreBundle\Command\Admin\Account\ResetPassword:
    properties:
        newPassword:
            - App\Validator\StrongPassword:
                groups: [sylius]
