applications:
    sylius:
        type: php:8.4
        relationships:
            database: "db:mysql"
        mounts:
            "config/jwt":
                source: storage
                source_path: jwt
            # Key that encrypts payment gateway settings (the Stripe API keys)
            # in the database. Losing it means re-entering the Stripe keys.
            "config/encryption":
                source: storage
                source_path: encryption
            "/var/cache":
                source: instance
                source_path: cache
            "/var/log":
                source: instance
                source_path: log
            "/var/sessions":
                source: storage
                source_path: sessions
            "/public/assets":
                source: storage
                source_path: assets
            "/public/bundles":
                source: storage
                source_path: bundles
            "/public/uploads":
                source: storage
                source_path: uploads
            "/public/media":
                source: storage
                source_path: media
        web:
            locations:
                "/":
                    root: "public"
                    passthru: "/index.php"
                    allow: true
                    expires: -1
                    scripts: true
                '/assets/shop':
                    expires: 2w
                    passthru: true
                    allow: false
                    rules:
                        ? '\.(css|js|jpe?g|png|gif|svgz?|ico|bmp|tiff?|wbmp|ico|jng|bmp|html|pdf|otf|woff2|woff|eot|ttf|jar|swf|ogx|avi|wmv|asf|asx|mng|flv|webm|mov|ogv|mpe|mpe?g|mp4|3gpp|weba|ra|m4a|mp3|mp2|mpe?ga|midi?)$'
                        :   allow: true
                '/media/image':
                    expires: 2w
                    passthru: true
                    allow: false
                    rules:
                        '\.(jpe?g|png|gif|svgz?)$':
                            allow: true
                '/media/cache/resolve':
                    passthru: "/index.php"
                    expires: -1
                    allow: true
                    scripts: true
                '/media/cache':
                    expires: 2w
                    passthru: true
                    allow: false
                    rules:
                        '\.(jpe?g|png|gif|svgz?|webp)$':
                            allow: true
        variables:
            env:
                APP_ENV: 'prod'
                APP_DEBUG: 0
                # The real key in the config/encryption mount, never the
                # committed test.key.
                SYLIUS_PAYMENT_ENCRYPTION_KEY_PATH: '%kernel.project_dir%/config/encryption/key'
                N_PREFIX: /app/.global
            php:
                # The prod container needs ~384M to compile (composer's
                # cache:clear in the build, the deploy hook, crons). At PHP's
                # default 128M the build fails.
                memory_limit: 512M
        build:
            flavor: composer
        dependencies:
            nodejs:
                n: "*"
            php:
                composer/composer: '^2'
        runtime:
            extensions:
                - sodium
        crons:
            sylius-cancel-unpaid-orders:
                spec: "0 2 * * *"
                cmd: "php bin/console --env=prod sylius:cancel-unpaid-orders"
            sylius-remove-expired-carts:
                spec: "0 2 * * *"
                cmd: "php bin/console --env=prod sylius:remove-expired-carts"
            # ORS Nasco syncs: turn on once the ORS credentials are set as Upsun
            # variables (see docs/local-setup.md "ORS Nasco sync").
            # Stock: ORS refreshes 6x a day (00:30, 07:30, 10:30, 11:30, 13:30,
            # 15:30 Central). Hourly at :45 runs 15 min after each refresh
            # whatever the UTC offset, and again an hour later if ORS was
            # late. It's one API call.
            # ors-sync-stock:
            #     spec: "45 * * * *"
            #     cmd: "php bin/console --env=prod app:ors:sync-stock"
            # Cost: nightly, ~70 SOAP calls for 2,737 SKUs (03:30 UTC).
            # ors-sync-cost:
            #     spec: "30 3 * * *"
            #     cmd: "php bin/console --env=prod app:ors:sync-cost"
            # Safety net for the purchase order queue: re-sends orders whose
            # message never reached the queue or was lost, and attempts the
            # worker died in the middle of (src/Command/DispatchPurchaseOrdersCommand.php).
            distributor-dispatch:
                spec: "*/15 * * * *"
                cmd: "php bin/console --env=prod app:distributor:dispatch"
            # Purchase order status from distributors (ORS Order Query: needs
            # ORS_OQ_PASSWORD/ORS_OQ_PASSWORD2, warns until set), tracking to
            # customers, and a daily-at-most email about stuck orders.
            # Card payments still only authorized after 6 days are charged before
            # Stripe releases the hold (src/Command/CaptureDuePaymentsCommand.php).
            payments-capture-due:
                spec: "15 * * * *"
                cmd: "php bin/console --env=prod app:payments:capture-due"
            distributor-sync-orders:
                spec: "20,50 * * * *"
                cmd: "php bin/console --env=prod app:distributor:sync-orders"
        workers:
            # Sends paid orders' purchase orders to distributors, retrying
            # with backoff when one is down (config/packages/messenger.yaml).
            # Exits hourly to free memory; Upsun starts it again.
            distributor-queue:
                commands:
                    start: "php bin/console --env=prod messenger:consume distributor --time-limit=3600 --memory-limit=256M"
        hooks:
            build: |
                set -e
                n auto
                hash -r
                curl -sS https://get.symfony.com/cli/installer | bash
                mv "$PLATFORM_APP_DIR/.symfony5/bin/symfony" "$PLATFORM_APP_DIR/.global/bin/symfony"
                cat >> "$PLATFORM_APP_DIR/.global/environment" <<EOS
                    export \$(symfony var:export)
                EOS
                # npm, not yarn: the project's lockfile is package-lock.json.
                # n auto (above) installs the Node version in .node-version.
                npm ci
                npm run build:prod
            deploy: |
                set -e
                rm -rf var/cache/*
                mkdir -p public/media/image
                bin/console doctrine:database:create --if-not-exists
                bin/console doctrine:migrations:migrate -n
                bin/console lexik:jwt:generate-keypair --skip-if-exists
                [ -f config/encryption/key ] || bin/console sylius:payment:generate-key -n
                bin/console assets:install --symlink --relative public
                bin/console cache:clear
        source:
            root: /
services:
    db:
        type: mysql:11.8
routes:
    "https://{default}/":
        type: upstream
        upstream: "sylius:http"
    "https://www.{default}/":
        type: redirect
        to: "https://{default}/"
