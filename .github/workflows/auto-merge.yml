name: Auto-merge

on:
    pull_request: ~

permissions:
    contents: read

jobs:
    # Turns on GitHub auto-merge for Dependabot patch/minor bumps. The merge
    # itself only happens once main's required status checks pass (branch
    # protection), so a bump can't land while CI is red. Major bumps are left
    # for a human to review.
    auto-merge:
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            -
                name: Fetch Dependabot metadata
                id: metadata
                uses: dependabot/fetch-metadata@v2

            -
                name: Enable auto-merge for patch and minor upgrades
                if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
                run: gh pr merge --auto --merge "$PR_URL"
                env:
                    PR_URL: ${{ github.event.pull_request.html_url }}
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
